<!doctype html>
<html><body>
<h1>Apply for Senior Software Engineer</h1>
<form id="application-form" onsubmit="event.preventDefault(); document.body.innerHTML='<h1>Thank you for applying!</h1>';">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text"></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" type="text"></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="text"></div>
  <div class="field"><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file"></div>
  <div class="field"><label for="question_1002">Are you legally authorized to work in the United States? *</label>
    <select id="question_1002" name="question_1002"><option value=""></option><option value="1">Yes</option><option value="0">No</option></select></div>
  <fieldset><legend>Which of these languages have you used professionally?</legend>
    <div><label><input type="checkbox" name="question_1005[]" value="1"> Go</label></div>
    <div><label><input type="checkbox" name="question_1005[]" value="2"> Rust</label></div>
    <label style="display:none">x</label>
  </fieldset>
  <div class="field"><label for="question_1004">Why do you want to work at Acme? *</label><textarea id="question_1004" name="question_1004"></textarea></div>
  <button type="submit">Submit application</button>
</form>
</body></html>
